<div *ngFor="let round of playoffStandingsByRound; let i = index">
  <div class="row bg-info">
    <div class="col">
      <h6 class="px-1 my-1">Round {{ i + 1 }} Results</h6>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th scope="col" class="col-a">Rank</th>
          <th scope="col" class="col-c">Team</th>
          <th scope="col" class="col-b">Points</th>
          <th scope="col" class="col-b">Hit</th>
          <th scope="col" class="col-b">Pit</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let team of playoffStandingsByRound[i]; let j = index">
          <th scope="row" class="col-a">{{ j + 1 }}</th>
          <td class="col-c">
            {{ pointsService.truncateTeamName(team.teamName) }}
          </td>
          <td class="col-b">
            {{ (team.points | number : "1.2-2")?.replace(",", "") }}
          </td>
          <td class="col-b">
            {{ (team.hitting | number : "1.2-2")?.replace(",", "") }}
          </td>
          <td class="col-b">
            {{ (team.pitching | number : "1.2-2")?.replace(",", "") }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
