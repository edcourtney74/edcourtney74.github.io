<div class="row bg-info">
  <div class="col">
    <h6 class="px-1 my-1">Week {{ selectedWeek }} results</h6>
  </div>
  <div class="col text-end">
    <div ngbDropdown class="d-inline-block">
      <button
        type="button"
        class="btn btn-light btn-sm my-1"
        id="dropdownBasic1"
        ngbDropdownToggle
      >
        Week {{ selectedWeek }}
      </button>
      <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
        <button
          *ngFor="let week of weeks"
          ngbDropdownItem
          (click)="onClick(week)"
        >
          Week {{ week }}
        </button>
      </div>
    </div>
  </div>
</div>
